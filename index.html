<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Discipline</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Condensed:wght@500;700&family=Roboto+Mono:wght@500;700&display=swap"><meta name="theme-color" content="#000"><link rel="icon" type="image/png" href="icon-192.png"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Discipline"><style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:dark;--bg:#000;--card:#1b1b1b;--tx:#ececec;--mu:#9b9b9b;--ln:#333;--ac:#4a86dc;--ac2:#3b3b3b;--red:#b3122c;--bad:#ff5468;--flagR:#a50f1f;--flagB:#0a2a5e;--blue:#12397a;--ok:#3fb868}
*{box-sizing:border-box}
html,body{margin:0;color:var(--tx);font:16px/1.4 Roboto,"Helvetica Neue",Arial,sans-serif}
body{position:relative;background:var(--bg)}
main{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:14px 16px 110px}
h1,.hdr,nav button,.chip,.card>b:first-child,.card>.row:first-child>b{font-family:"Roboto Condensed",Roboto,Arial,sans-serif}
h1{font-size:26px;margin:6px 0 2px;text-transform:uppercase;letter-spacing:.09em;font-weight:700}
.sub{color:var(--mu);font-size:13px;margin-bottom:14px}
.hdr{display:flex;align-items:center;gap:10px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;padding-bottom:10px;border-bottom:1px solid var(--ln);margin-bottom:10px}.hdr span:last-child{margin-left:auto;color:var(--mu)}.hdr svg{width:34px;height:18px;border-radius:2px}
#bg{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;z-index:0;pointer-events:none;background:#000 top center/100% auto no-repeat;-webkit-mask-image:linear-gradient(#000 0%,#000 65%,transparent 100%);mask-image:linear-gradient(#000 0%,#000 65%,transparent 100%)}
.ht.tp{justify-content:flex-start}
.ht{height:150px;display:flex;flex-direction:column;justify-content:flex-end;margin:4px 0 12px;text-shadow:0 2px 12px #000,0 0 3px #000}
.ht .k{font:700 11px "Roboto Mono",monospace;letter-spacing:.16em;color:#a8172b}.ht .t{font:700 30px "Roboto Condensed",sans-serif;letter-spacing:.1em;text-transform:uppercase}
.sub{text-shadow:0 1px 6px #000}
.card{background:rgba(27,27,27,.93);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid var(--ln);border-left:3px solid var(--red);border-radius:12px;padding:14px;margin-bottom:12px}
.card>b:first-child,.card>.row:first-child>b{text-transform:uppercase;letter-spacing:.1em;font-size:13px;color:#d6d6d6}
.big{font:700 30px "Roboto Mono",monospace;letter-spacing:-1px}.mu{color:var(--mu);font-size:13px}
.bar{height:10px;background:var(--ln);border-radius:3px;overflow:hidden;margin:10px 0 6px}.bar i{display:block;height:100%;background:var(--ac)}.bar.over i{background:var(--bad)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.item{padding:10px 0;border-top:1px solid var(--ln)}.item:first-child{border-top:0}
.x{background:none;border:0;color:var(--mu);font-size:18px;padding:4px 8px}
input,select,textarea{width:100%;padding:12px;border-radius:8px;border:1px solid var(--ln);background:#111;color:var(--tx);font:16px Roboto,Arial,sans-serif;min-width:0;max-width:100%}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;display:block;text-align:left}
input[type=date]:not(.kg),input[type=time]:not(.kg){min-height:46px}
input::-webkit-date-and-time-value{text-align:left;min-height:1.3em}
.f>*{min-width:0}
.f{display:grid;grid-template-columns:1fr 1fr;gap:8px}.f .w{grid-column:1/3}
button.go{width:100%;padding:13px;border:0;border-radius:8px;background:var(--red);color:#fff;font:700 15px "Roboto Condensed",sans-serif;letter-spacing:.12em;text-transform:uppercase;margin-top:8px}
.chart{display:flex;align-items:flex-end;gap:6px;margin-top:10px;position:relative}.chart div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;text-align:center;font-size:11px;line-height:15px;color:var(--mu)}.chart small{font-size:9px;line-height:12px}
.chart span{display:block;background:var(--ac2)}.chart span.t,.chart span.ex{border-radius:3px 3px 0 0}.chart .ok span{background:var(--ok)}.chart .ok span.ex{background:#9bffbc}.chart .bad span{background:#8a2231}.chart .bad span.ex{background:var(--bad)}.chart .cur{opacity:.6}.gt{position:absolute;right:0;font:9px "Roboto Mono",monospace;font-style:normal;color:var(--bad)}
.gl{position:absolute;left:0;right:0;border-top:1px dashed var(--red);pointer-events:none}
nav{z-index:10;position:fixed;left:0;right:0;bottom:0;background:#0a0a0a;border-top:1px solid var(--ln);display:flex;padding:0 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;border:0;color:var(--mu);font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:8px 0 4px;box-shadow:inset 0 2px 0 transparent}nav button span{display:block}nav .ic{width:24px;height:24px;margin:0 auto 2px}
nav button.on{color:#fff;font-weight:700;box-shadow:inset 0 2px 0 var(--red)}
.dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{padding:9px 13px;border-radius:6px;border:1px solid var(--ln);background:#111;color:var(--tx);font-size:13px;letter-spacing:.05em;text-transform:uppercase}.chip.on{background:var(--blue);border-color:var(--ac);color:#fff}
.sets{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.chip.set{min-width:54px;padding:11px 0;text-align:center;opacity:.65;font:700 15px "Roboto Mono",monospace}.chip.set.on{opacity:1}
.kg{width:68px!important;padding:8px!important;display:inline-block}
.dt{display:block;height:16px;border-radius:3px;background:var(--ln)}.dt.ok{background:var(--ok)}.dt.bad{background:var(--bad)}
.wk{display:grid;grid-template-columns:64px repeat(7,1fr);gap:6px;align-items:center}
.strip{display:flex;gap:6px;overflow-x:auto}.strip .chip{flex:0 0 auto;padding:7px 10px;text-align:center;line-height:1.25}
.ic{width:20px;height:20px}.card .ic{width:16px;height:16px;vertical-align:-3px;margin-right:6px}.chip .ic{width:14px;height:14px;margin:0;vertical-align:-2px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--red);color:#fff;padding:10px 16px;border-radius:6px;font:700 14px "Roboto Condensed",sans-serif;letter-spacing:.06em;opacity:0;transition:opacity .25s;pointer-events:none;z-index:11}
.ovb{font:700 56px/1 "Roboto Mono",monospace;letter-spacing:-2px;margin:8px 0 10px}.ovb small{font-size:24px;letter-spacing:0;color:var(--mu)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:10px;max-width:460px}
.cd{box-sizing:border-box;height:46px;overflow:hidden;white-space:nowrap;display:flex;flex-direction:column;justify-content:space-between;padding:3px 4px 4px;border:1px solid var(--ln);border-radius:6px;background:#111;color:var(--mu);font:500 10px "Roboto Mono",monospace;text-align:left;min-width:0}
.cd.td{border-color:var(--ac)}.cd.none{opacity:.35}.cd.done{background:#10200f}.cd.miss{background:#2a0e13}.cd.rest{background:#0d1a2b}
.ics{display:flex;justify-content:center;gap:1px}.cd .ic{width:15px;height:15px;margin:0!important;vertical-align:0}
.g{color:var(--ok)}.r{color:var(--bad)}.bl{color:var(--ac)}
button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}.big,.ovb{font-variant-numeric:tabular-nums}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.wl{text-decoration:none;display:inline-block;color:#fff;background:var(--blue);border-color:var(--ac);margin:0 2px}
input.ck{width:22px;height:22px;min-width:22px;flex:0 0 22px;padding:0;accent-color:var(--ok)}
</style></head>
<body><div id="bg"></div><main id="app"></main>
<nav id="nav"></nav>
<script>
const TABS={today:['★','Today'],spend:['★','Spending'],food:['★','Food'],faith:['★','Faith'],fit:['★','Fitness'],wish:['★','Wishes']};
const svg=p=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const ICON={today:svg('<polygon points="12,2.5 14.8,9 21.5,9.5 16.3,14 18,21 12,17.3 6,21 7.7,14 2.5,9.5 9.2,9" fill="currentColor"/>'),spend:svg('<circle cx="12" cy="12" r="9"/><path d="M14.6 9.2c-.5-1-1.5-1.6-2.7-1.6-1.5 0-2.5.8-2.5 2s1 1.7 2.7 2.1c1.7.4 2.7.9 2.7 2.1s-1 2-2.7 2c-1.3 0-2.4-.6-2.8-1.7M12 5.5v13"/>'),food:svg('<path d="M6 3v7a2 2 0 0 0 4 0V3M8 3v18M17 3c-2.2 1.2-3 4-3 7h3v11"/>'),faith:svg('<path d="M3 5c3-1.6 6-1.6 9 0 3-1.6 6-1.6 9 0v14c-3-1.6-6-1.6-9 0-3-1.6-6-1.6-9 0zM12 5v14"/>'),fit:svg('<path d="M6 6v12M3 9v6M18 6v12M21 9v6M6 12h12"/>'),run:svg('<path d="M5 6l6 6-6 6M13 6l6 6-6 6"/>'),rest:svg('<path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/>'),miss:svg('<circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/>')};
ICON.wish=svg('<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M5 12v9h14v-9M7.5 8a2.5 2.5 0 1 1 0-5C10 3 12 8 12 8s2-5 4.5-5a2.5 2.5 0 1 1 0 5"/>');
function flag(){let st='';for(let r=0;r<9;r++){const n=r%2?5:6;for(let k=0;k<n;k++){const cx=r%2?6.33*(2*k+2):6.33*(2*k+1),cy=5.4*(r+1);let p='';for(let i=0;i<10;i++){const a=Math.PI*i/5-Math.PI/2,q=i%2?0.75:1.9;p+=(cx+q*Math.cos(a)).toFixed(1)+','+(cy+q*Math.sin(a)).toFixed(1)+' '}st+=`<polygon points="${p}" fill="#fff"/>`}}
 let b='';for(let i=0;i<13;i++)b+=`<rect y="${(i*7.692).toFixed(2)}" width="190" height="7.7" fill="${i%2?'#f1f1f1':'var(--flagR)'}"/>`;
 return`<svg viewBox="0 0 190 100" preserveAspectRatio="xMidYMid slice">${b}<rect width="76" height="53.85" fill="var(--flagB)"/>${st}</svg>`}
const dayN=()=>Math.min(54,Math.max(1,Math.round((new Date(today)-new Date('2026-10-05'))/864e5)+1));
const hdr=()=>`<div class="hdr">${flag()}<span>Daily Discipline</span><span>Day ${dayN()}/54 <i class="dot sdot" style="background:${SYC[SY]};margin:0 0 0 6px"></i></span></div>`;
let BGI=null;const hero=(img,ar,t,k,f,al,dy)=>{BGI=[img,ar,f||.85,dy||0];return`<div class="ht${al==='t'?' tp':''}"><div class="k">${k||'DAY '+dayN()+' OF 54'}</div><div class="t">${t}</div></div>`};
const CATS=[['Unavoidable Expenses','var(--ac)'],['Optional Stuff','#c9d1e3'],['Absolutely Frivolous Fun Stuff','#e0364f']];
const iso=d=>{const z=new Date(d);return z.getFullYear()+'-'+String(z.getMonth()+1).padStart(2,'0')+'-'+String(z.getDate()).padStart(2,'0')};
const today=iso(new Date());const money=n=>'$'+n.toFixed(2);const pc=n=>Math.round(n*100)+'%';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sn=c=>['Unavoidable','Optional','Frivolous'][CATS.findIndex(x=>x[0]===c)]||c;
const uid=()=>Math.random().toString(36).slice(2);
const SP="2026-09-27|chocolate|F|69.26;2026-09-30|croissant|O|1.14;2026-09-30|breakfast|O|6.52;2026-09-30|train from airport|U|11.28;2026-09-30|Lidl|U|15.95;2026-09-29|Lidl|U|25.76;2026-10-01|lidl|U|37.51;2026-10-01|lidl|U|5.16;2026-10-05|croissant|O|2;2026-10-05|carrefour|U|12.48;2026-10-05|transit|O|13.68;2026-10-05|lidl|U|25.54;2026-10-05|doner kebap|O|27.36;2026-10-05|train to brugge|O|37.17;2026-10-05|red bull|F|2.65;2026-10-06|lidl|U|32.1;2026-10-07|mobile data|O|10.59;2026-10-07|lidl|U|23.28;2026-10-07|used books|O|11.28;2026-10-07|Leather Jacket|F|56.95;2026-10-08|mushroom growing kit|F|36.96;2026-10-08|lidl|F|11.28;2026-10-08|coke zero lemon|F|1.12;2026-10-08|Lidl|U|15.25;2026-10-09|Irish Pub|O|24.81;2026-10-10|cash money ATM|O|97.84;2026-10-10|animal fries|F|8.43;2026-10-10|Lidl|O|4.98;2026-10-10|Lidl|U|40.28;2026-10-10|les petits Riens|O|82.08;2026-10-10|syrian desserts|F|12.7;2026-10-11|transit to church|U|9.45;2026-10-12|peter's birthday supplies|O|78.76;2026-10-12|purse & fries for meishe|F|24.63;2026-10-12|ferris wheel|F|22.49;2026-10-13|red bull|F|2.41;2026-10-13|baguettes, cocoa|O|10.07";
const FD="2026-10-09|8|1|3 eggs, bread, ham, cheese|Overfull|fish and chips|Satisfied|chicken pasta, creamed spinach|Satisfied;2026-10-10|7|0|croque|Full|fries, mayo, croissant, red bull|Satisfied|date roll and ice cream|Satisfied;2026-10-11|16|0||Satisfied|spam and rice|Satisfied|mashed potatoes|Full;2026-10-12|8|1|eggs, bread, yogurt|Satisfied|mashed potatoes, croissant, diet coke, milk|Full|bacon nacho fries|Satisfied;2026-10-13|11.5||apple and red bull|Satisfied|grilled cheese and tomato soup|Overfull|wok mix and rice, diet coke, milk|Full";
const FA="2026-10-05|30|10|20|0|0|270|Daily wire;2026-10-06|30|0|20|0|0|270|Daily wire;2026-10-07|30|10|0|0|0|270|Daily wire;2026-10-08|15|0|0|0|0|270|Daily wire;2026-10-09|15|0|0|0|15|141|DW, Tolstoy;2026-10-10|10|0|0|0|3|41|DW, Tolstoy;2026-10-11|30|30|0|25|30|0|lamb of god;2026-10-12|30|30|0|0|0|200|The office, DW;2026-10-13|30|30|0|10|50|140|GC, music, DW, office";
function seed(){const S={tab:'spend',spend:[],food:{},faith:{},fit:[],start:3590.06,budget:200,goal:30};
 SP.split(';').forEach(r=>{const p=r.split('|');S.spend.push({id:uid(),d:p[0],t:p[1],c:CATS['UOF'.indexOf(p[2])][0],a:+p[3]})});
 FD.split(';').forEach(r=>{const p=r.split('|');S.food[p[0]]={fh:+p[1],sn:p[2]===''?undefined:p[2]==='1',b:p[3],bs:p[4],l:p[5],ls:p[6],d:p[7],ds:p[8]}});
 FA.split(';').forEach(r=>{const p=r.split('|');S.faith[p[0]]={pers:+p[1],comp:+p[2],lang:+p[3],gtr:+p[4],up:+p[5],dis:+p[6],n:p[7]}});return S}
let S=seed();
try{const r=localStorage.getItem('habits2');if(r)S=JSON.parse(r)}catch(e){}
const persist=()=>{try{localStorage.setItem('habits2',JSON.stringify(S))}catch(e){}};
const save=()=>{const h=hs(JSON.stringify(payload()));if(h!==S.h){S.h=h;S.dirty=true;pushSoon()}persist()};
const days7=()=>{const a=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);a.push(iso(d))}return a};
const dl=d=>'SMTWTFS'[new Date(d+'T12:00').getDay()];
function chart(vals,mx,goal,fmt,labels,cls){const H=72,L=labels||days7().map(dl),g=goal/mx*H+15;
 return`<div class="chart" style="height:${H+30}px">${goal?`<i class="gl" style="bottom:${g}px"></i><em class="gt" style="bottom:${g+2}px">${fmt(goal)}</em>`:''}`+vals.map((v,i)=>{const b=Math.min(v,goal||0)/mx*H,x=Math.max(0,Math.min(v,mx)-(goal||0))/mx*H,c=cls?cls(v,i):(goal&&v>=goal?'ok':'');return`<div class="${c}"><small>${v?fmt(v):''}</small>${x>0?`<span class="ex" style="height:${x}px"></span>`:''}<span class="${x>0?'':'t'}" style="height:${v>0?Math.max(2,b):0}px"></span>${L[i]}</div>`}).join('')+'</div>'}
function setV(k,f,v){const e=(S[k][today]=S[k][today]||{}),b=k==='faith'?dayPct(e):0;e[f]=v;if(k==='faith'&&f!=='wk'&&v&&!e.wk&&!e.rise&&new Date().getHours()<12)e.wk=nowT();if(k==='food'&&['b','l','d'].includes(f)&&v&&!e[f+'t'])e[f+'t']=nowT();save();render();if(k==='faith'&&b<.8&&dayPct(e)>=.8){let n=0;for(const d of days7().reverse()){if(dayPct(S.faith[d])>=.8)n++;else break}toast('Target hit! '+n+'-day streak ★')}}
function setN(k,f,v){setV(k,f,v===''?undefined:+v)}
const num=(k,f,ph,step)=>`<input type="number" inputmode="decimal" step="${step||1}" placeholder="${ph}" value="${esc((S[k][today]||{})[f])}" onchange="setN('${k}','${f}',this.value)">`;
/* SPENDING */
function weekRange(){const d=new Date();d.setDate(d.getDate()-d.getDay());const e=new Date(d);e.setDate(d.getDate()+6);return[iso(d),iso(e)]}
function spend(){
 const[a,b]=weekRange();const wk=S.spend.filter(x=>x.d>=a&&x.d<=b);const tot=wk.reduce((s,x)=>s+x.a,0);
 const all=S.spend.reduce((s,x)=>s+x.a,0);const rem=S.budget-tot;
 const fr=S.spend.filter(x=>x.c===CATS[2][0]).reduce((s,x)=>s+x.a,0);
 const caps=S.caps||[0,90,40],exp=S.budget*(new Date().getDay()+1)/7,pace=tot<=exp?'On pace · '+money(exp-tot)+' of slack today':money(tot-exp)+' ahead of pace';const cn={};S.spend.forEach(x=>{const k=x.t.toLowerCase();cn[k]=(cn[k]||0)+1});const top=Object.keys(cn).filter(t=>!/['"]/.test(t)).sort((a,b)=>cn[b]-cn[a]).slice(0,5).map(t=>`<button class="chip" onclick="document.getElementById('t').value='${esc(t)}';sugCat('${esc(t)}')">${esc(t)}</button>`).join('');
 const cats=CATS.map(([n,c],i)=>{const v=wk.filter(x=>x.c===n).reduce((s,x)=>s+x.a,0),cp=caps[i];return`<div class="item"><div class="row"><span><i class="dot" style="background:${c}"></i>${sn(n)}</span><span><b>${money(v)}</b>${i?` / <input class="kg" type="number" value="${cp}" onchange="S.caps=S.caps||[0,90,40];S.caps[${i}]=+this.value;save();render()">`:''}</span></div>${i?`<div class="bar ${v>cp?'over':''}" style="height:6px;margin:6px 0 0"><i style="width:${Math.min(100,v/cp*100)}%"></i></div>`:''}</div>`}).join('');
 const rec=[...S.spend].sort((x,y)=>y.d.localeCompare(x.d)).slice(0,15).map(x=>`<div class="item row"><span><b>${esc(x.t)}</b><br><span class="mu">${x.d} · ${sn(x.c)}</span></span><span>${money(x.a)}<button class="x" onclick="del('spend','${x.id}')">×</button></span></div>`).join('');
const bankCard=bankUI();
 const A=S.acct||[],dep=A.filter(a=>a.type==='depository'),cr=A.filter(a=>a.type==='credit');
 const av=a=>a.avail!=null?a.avail:(a.cur||0),cash=dep.reduce((s,a)=>s+av(a),0),owed=cr.reduce((s,a)=>s+(a.cur||0),0),bal=A.length?cash-owed:S.start-all;
 const ar=a=>`<div class="item row"><span>${esc(a.name)}${a.mask?' <span class="mu">··'+esc(a.mask)+'</span>':''}</span><b>${a.type==='credit'?'owes '+money(a.cur||0):money(av(a))}</b></div>`;

const cloudCard=()=>AU?`<div class="card"><b>Cloud backup</b><div class="mu" style="margin-top:6px">Signed in as ${esc(AU.em)}</div><div class="mu" style="margin:8px 0"><i class="dot sdot" style="background:${SYC[SY]}"></i><span id="ss">${esc(SYT)}</span></div><div class="f"><button class="go" onclick="sync()">Sync now</button><button class="go" style="background:var(--blue)" onclick="signOut()">Sign out</button></div></div>`:`<div class="card"><b>Cloud backup</b><div class="mu" style="margin:6px 0 8px">Sign in to back up and sync across devices.</div><input id="em" type="email" autocomplete="username" placeholder="Email" style="margin-bottom:8px"><input id="pw" type="password" autocomplete="current-password" placeholder="Password"><button class="go" onclick="signIn()">Sign in</button><div class="mu" id="ss" style="margin-top:8px">${esc(SYT)}</div></div>`;
/* BANK (Plaid via Supabase function) */
const PF=SB+'/functions/v1/plaid';let BANK=[],busyB=false;
async function pcall(body){const t=await token();const r=await fetch(PF,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'HTTP '+r.status);return j}
const loadPlaid=()=>window.Plaid?Promise.resolve():new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdn.plaid.com/link/v2/stable/link-initialize.js';s.onload=ok;s.onerror=()=>no(new Error('Could not load Plaid'));document.head.appendChild(s)});
async function bankFlush(){if(!(S.ackQ||[]).length)return;try{await pcall({action:'ack',ids:S.ackQ});S.ackQ=[];persist()}catch(e){}}
async function bankBal(live,manual){const say=live||manual;try{const j=await pcall({action:'balances',live:!!live});S.acct=j.accounts||[];S.acctAt=Date.now();S.acctErr=S.acct.length?'':'Bank returned no accounts. Tap Reconnect and tick your checking and card accounts.';save();if(say)toast(S.acct.length?'Balances updated':S.acctErr)}catch(e){S.acctErr=e.message.slice(0,140);persist();if(say)toast(S.acctErr)}if(S.tab==='spend'&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))render()}
async function bankSync(silent,auto){if(!AU||busyB)return;if(silent&&S.bankAt&&Date.now()-S.bankAt<6e5)return;busyB=true;
 try{await bankFlush();const j=await pcall({action:'sync'});S.plaidOn=!!j.linked;const fl=S.bankFrom=S.bankFrom||'2026-09-21',skip=[];let hit=false;BANK=[];
  for(const x of (j.txns||[])){if((S.ackQ||[]).includes(x.id))continue;if(x.date<fl){skip.push(x.id);continue}
   const c=auto?catFor(x.name):-1;
   if(c>=0){S.spend.push({id:uid(),t:x.name,a:Math.round(x.amount*100)/100,d:x.date,c:CATS[c][0],src:'bank',bid:x.id});hit=true;skip.push(x.id);continue}BANK.push(x)}
  if(skip.length)S.ackQ=(S.ackQ||[]).concat(skip);if(hit)save();S.bankAt=Date.now();S.bankErr='';persist();if(skip.length)bankFlush();if(j.linked)await bankBal();
  if(S.tab==='spend'&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))render();
  if(!silent)toast(j.linked?(BANK.length?BANK.length+' to review':'Up to date'):'No bank connected')}
 catch(e){if(e.message!=='off'){S.bankErr=e.message.slice(0,140);persist();if(!silent)toast(S.bankErr)}}
 busyB=false}
async function bankConnect(upd){if(!AU)return toast('Sign in first');
 try{toast('Opening bank link…');await loadPlaid();const j=await pcall({action:'link_token',update:!!upd});if(!j.link_token)throw new Error('The plaid function did not return a link token. Check its code and secrets.');
  Plaid.create({token:j.link_token,onSuccess:async pt=>{try{if(!upd)await pcall({action:'exchange',public_token:pt});S.plaidOn=true;S.bankAt=0;S.bankErr='';persist();toast('Bank connected ★');await bankSync();render()}catch(e){toast(e.message.slice(0,90))}},onExit:err=>{if(err)toast((err.display_message||err.error_message||'Link closed').slice(0,90))}}).open()}
 catch(e){toast(e.message.slice(0,90))}}
async function bankUnlink(){if(!confirm('Disconnect the bank? You can reconnect later.'))return;try{await pcall({action:'unlink'});S.plaidOn=false;BANK=[];S.ackQ=[];S.bankErr='';S.acct=[];save();render();toast('Disconnected')}catch(e){toast(e.message.slice(0,90))}}
function bkAdd(i,c){const x=BANK[i];if(!x)return;S.spend.push({id:uid(),t:x.name,a:Math.round(x.amount*100)/100,d:x.date,c:CATS[c][0],src:'bank',bid:x.id});(S.catMem=S.catMem||{})[x.name.toLowerCase()]=c;BANK.splice(i,1);S.ackQ=(S.ackQ||[]).concat(x.id);save();render();toast(weekLeft());bankFlush()}
function bkSkip(i){const x=BANK[i];if(!x)return;BANK.splice(i,1);S.ackQ=(S.ackQ||[]).concat(x.id);persist();render();bankFlush()}
function bankUI(){if(!AU)return'';
 if(!S.plaidOn)return`<div class="card"><b>Bank connection</b><div class="mu" style="margin:6px 0 4px">Pull your transactions in automatically. Set this up from a computer browser.</div>${S.bankErr?`<div class="mu" style="color:var(--bad)">${esc(S.bankErr)}</div>`:''}<button class="go" onclick="bankConnect()">Connect bank</button></div>`;
 const sg=n=>{const k=String(n).toLowerCase(),x=[...S.spend].reverse().find(y=>y.t.toLowerCase()===k);return x?CATS.findIndex(c=>c[0]===x.c):-1};
 const rows=BANK.map((x,i)=>{const s=sg(x.name);return`<div class="item"><div class="row"><span><b>${esc(x.name)}</b><br><span class="mu">${x.date}</span></span><span>${money(+x.amount)}<button class="x" onclick="bkSkip(${i})">×</button></span></div><div class="chips" style="margin-top:6px">${['Unavoidable','Optional','Frivolous'].map((n,c)=>`<button class="chip ${s===c?'on':''}" onclick="bkAdd(${i},${c})">${n}</button>`).join('')}</div></div>`}).join('');
 return`<div class="card"><div class="row"><b>Bank inbox</b><span><button class="chip" onclick="bankSync()">Sync</button> <button class="chip" onclick="bankBal(false,true)">Balances</button> <button class="chip" onclick="bankConnect(true)">Reconnect</button></span></div>${S.bankErr?`<div class="mu" style="color:var(--bad);margin-top:6px">${esc(S.bankErr)}</div>`:''}${S.acctErr?`<div class="mu" style="color:var(--bad);margin-top:6px">Balance: ${esc(S.acctErr)}</div>`:(S.acct&&S.acct.length?'':'<div class="mu" style="margin-top:6px">Bank balance not loaded yet. Tap Balances.</div>')}${rows||'<div class="mu" style="margin-top:8px">All caught up</div>'}<div class="row" style="margin-top:10px"><span class="mu">Import from</span><input type="date" style="width:150px" value="${esc(S.bankFrom||'2026-09-21')}" onchange="S.bankFrom=this.value;persist()"></div><div class="row" style="margin-top:10px"><span class="mu">${S.bankAt?'Updated '+new Date(S.bankAt).toTimeString().slice(0,5):''}</span><span><button class="chip" onclick="bankReplace()">Start over</button> <button class="chip" onclick="bankUnlink()">Disconnect</button></span></div></div>`}
const catFor=n=>{const k=String(n).toLowerCase(),m=S.catMem||{};if(k in m)return m[k];const h=Object.keys(m).find(z=>z.length>=4&&(k.includes(z)||z.includes(k)));return h!==undefined?m[h]:-1};
async function bankReplace(){const from='2026-09-21';
 if(!confirm('This DELETES all '+S.spend.length+' spending entries you have now and replaces them with bank transactions dated '+from+' or later. A CSV backup downloads first. Continue?'))return;
 try{try{localStorage.setItem('dd_spend_backup',JSON.stringify(S.spend))}catch(e){}
  csvOut();
  const mem={};S.spend.forEach(x=>{const i=CATS.findIndex(c=>c[0]===x.c);if(i>=0)mem[x.t.toLowerCase()]=i});
  S.catMem=Object.assign(S.catMem||{},mem);S.spend=[];S.bankFrom=from;S.ackQ=[];S.bankAt=0;BANK=[];save();
  await pcall({action:'resetall'});render();await bankSync(false,true);
  toast('Rebuilt from bank ★ '+S.spend.length+' added'+(BANK.length?', '+BANK.length+' to categorize':''))}
 catch(e){toast(e.message.slice(0,90))}}
function todayV(){
 const e=S.food[today]||{},fa=S.faith[today]||{},fx=S.fx[today],h=new Date().getHours(),[a,b]=weekRange();
 const tot=S.spend.filter(x=>x.d>=a&&x.d<=b).reduce((s,x)=>s+x.a,0),exp=S.budget*(new Date().getDay()+1)/7;
 const meals=[e.b||e.bx,e.l||e.lx,e.d||e.dx].filter(Boolean).length,pct=dayPct(fa),left=H.filter(x=>CORE.includes(x[0])&&!(x[0]==='rise'?(WM(fa)!=null||fa.rise):hd(fa,x))).map(x=>x[1].split(' (')[0]);
 const sets=fx&&fx.lift&&fx.ex?[fx.ex.reduce((s,x)=>s+sdone(x),0),fx.ex.reduce((s,x)=>s+x.s.length,0)]:[0,0];
 const ft=fx&&fx.rest?'Rest day':fx&&(fx.lift||fx.run)?[fx.lift?(fx.lift==='cali'?'Calisthenics':fx.split)+' · '+sets[0]+'/'+sets[1]+' sets':'',fx.run?(fx.mi>0?'Ran '+fx.mi+' mi ✓':'Run goal '+(fx.tgt||'?')+' mi'):''].filter(Boolean).join(' + '):'Nothing planned yet';
 const risk=[];if(h>=18&&pct<.8)risk.push('Faith at '+pc(pct)+(left.length?' · open: '+left.join(', '):''));if(h>=19&&meals<3)risk.push((3-meals)+' meal(s) not logged');if(h>=17&&fx&&!fx.rest&&!fdone(fx))risk.push('Workout not started');if(tot>exp*1.15)risk.push('Spending is ahead of pace');if(!bk()&&(!S.lastExp||(new Date(today)-new Date(S.lastExp))/864e5>=7))risk.push('Export a CSV backup'+(S.lastExp?' · last '+S.lastExp:''));
 const D=days7(),row=(l,f)=>`<span class="mu">${l}</span>`+D.map(d=>{const v=f(d);return`<i class="dt ${v==null?'':v?'ok':'bad'}"></i>`}).join('');
 const card=(t,ic,m,sub)=>`<div class="card" onclick="go('${t}')"><div class="row"><b>${ICON[t]}${TABS[t][1]}</b><span class="mu">›</span></div><div class="big" style="font-size:22px">${m}</div><div class="mu">${sub}</div></div>`;
 const dataCard=bk()?'':`<div class="card"><b>Your data</b><div class="mu">Stored on this device only. Export a CSV regularly${S.lastExp?' · last export '+S.lastExp:''}.</div><div class="f" style="margin-top:8px"><button class="go" onclick="csvOut()">Export CSV</button><button class="go" style="background:var(--blue)" onclick="document.getElementById('cf').click()">Import</button></div><input id="cf" type="file" accept=".csv,.json,text/csv" style="display:none" onchange="csvFile(this)"><div class="row" style="margin-top:10px"><button class="chip" onclick="csvCopy()">Copy CSV</button><button class="chip" onclick="importData(document.getElementById('bk').value)">Import pasted text</button></div><textarea id="bk" placeholder="Paste a CSV or an old backup here" style="width:100%;height:56px;margin-top:8px"></textarea></div>`;
 return`${hero('hero-today.jpg','960/727',"Today's Briefing",'DAY '+dayN()+' OF 54 · '+new Date().toDateString().toUpperCase(),.92,'t')}
 ${ovCard()}
 ${risk.length?`<div class="card" style="border-color:var(--bad)"><b>Heads up</b>${risk.map(r=>`<div class="mu">• ${r}</div>`).join('')}</div>`:''}
 ${card('fit','★',ft,'Tap to log sets')}${card('faith','★',pc(pct)+' of daily habits',left.length?'Core left: '+left.join(', '):'All core habits done')}${card('food','★',(e.fh!=null?e.fh+'h fast · ':'')+meals+'/3 meals',liveText())}${card('spend','★',weekLeft(),tot<=exp?'On pace for the week':'Ahead of pace')}
 <div class="card"><b>Last 7 days</b><div class="wk" style="margin-top:8px"><span></span>${D.map(d=>`<span class="mu" style="text-align:center">${dl(d)}</span>`).join('')}
 ${row('Fitness',d=>{const q=fxs(d);return q==='done'||q==='rest'?true:q==='miss'?false:null})}${row('Food',d=>S.food[d]&&S.food[d].fh!=null?S.food[d].fh>=16:null)}${row('Faith',d=>S.faith[d]?dayPct(S.faith[d])>=.8:null)}${row('Spending',d=>S.spend.filter(x=>x.d===d).reduce((s,x)=>s+x.a,0)<=S.budget/7)}</div><div class="mu" style="margin-top:6px"><i class="dot" style="background:var(--ok)"></i>Goal met <i class="dot" style="background:var(--bad);margin-left:8px"></i>Missed <i class="dot" style="background:var(--ln);margin-left:8px"></i>No data</div></div>
 ${cloudCard()}${dataCard}`}
function del(k,id){S[k]=S[k].filter(x=>x.id!==id);save();render()}
const OK='wishM';
/* WISH LIST: each person edits only their own list; the other list is view-only */
let WE=null,WSH={};
const wurl=u=>{u=String(u||'').trim();if(!u)return'';if(!/^[a-z][a-z0-9+.-]*:/i.test(u))u='https://'+u;try{const x=new URL(u);return/^https?:$/.test(x.protocol)?x.href:''}catch(e){return''}};
const wBtn=u=>u?`<a class="chip wl" href="${esc(u)}" target="_blank" rel="noopener noreferrer">Open link</a>`:'';
function wAdd(){const i=document.getElementById('wnew'),n=i.value.trim();if(!n)return;(S.wish=S.wish||[]).unshift({id:uid(),n,u:''});i.value='';save();render()}
function wEdit(id){WE=id;render()}
function wSave(id){const it=(S.wish||[]).find(x=>x.id===id);if(!it)return;const n=document.getElementById('wn').value.trim(),raw=document.getElementById('wu').value.trim(),u=wurl(raw);if(raw&&!u)return toast("That link doesn't look right");if(n)it.n=n;it.u=u;WE=null;save();render()}
function wDel(id){S.wish=(S.wish||[]).filter(x=>x.id!==id);WE=null;save();render()}
function wGot(id,on){const it=(S.wish||[]).find(x=>x.id===id);if(it){it.g=on?1:0;save();render();if(on)toast('Marked as purchased ★')}}
function wBuy(id,on){const B=new Set(S.wishB||[]);on?B.add(id):B.delete(id);S.wishB=[...B];save();render();if(on)toast('Hidden from your view ★')}
function wTog(k){WSH[k]=!WSH[k];render()}
const wTxt=(t,d)=>`<span style="overflow-wrap:anywhere${d?';text-decoration:line-through;opacity:.55':''}">${esc(t)}</span>`;
const wOwn=(it,d)=>WE===it.id?`<div class="item"><input id="wn" value="${esc(it.n)}" placeholder="Item name"><input id="wu" value="${esc(it.u)}" placeholder="Link (optional)" inputmode="url" autocapitalize="off" autocorrect="off" style="margin-top:6px"><div class="row" style="margin-top:8px"><button class="chip" onclick="wDel('${it.id}')">Delete</button><button class="chip on" onclick="wSave('${it.id}')">Save</button></div></div>`:`<div class="item row"><span style="display:flex;align-items:center;gap:10px;min-width:0"><input type="checkbox" class="ck" ${d?'checked':''} onchange="wGot('${it.id}',this.checked)">${wTxt(it.n,d)}</span><span style="white-space:nowrap;display:flex;align-items:center">${it.u?wBtn(it.u):`<button class="chip" onclick="wEdit('${it.id}')">+ Link</button>`}<button class="x" onclick="wEdit('${it.id}')">✎</button></span></div>`;
const wOth=(it,d)=>`<div class="item row"><span style="display:flex;align-items:center;gap:10px;min-width:0"><input type="checkbox" class="ck" ${d?'checked':''} onchange="wBuy('${it.id}',this.checked)" title="I bought this">${wTxt(it.n,d)}</span><span style="white-space:nowrap">${wBtn(it.u)}</span></div>`;
function wishCards(W,ownName,othName){
 const mine=S.wish||[],open=mine.filter(x=>!x.g),got=mine.filter(x=>x.g);
 const B=new Set(S.wishB||[]),oth=(S[OK]||[]).filter(x=>!x.g),vis=oth.filter(x=>!B.has(x.id)),bought=oth.filter(x=>B.has(x.id));
 const tg=(k,n)=>n?`<div style="margin-top:10px"><button class="chip" onclick="wTog('${k}')">${WSH[k]?'Hide':'Show'} purchased (${n})</button></div>`:'';
 const empty='<div class="mu" style="margin-top:8px">Nothing here yet</div>';
 return W(othName+"'s list",(vis.map(x=>wOth(x,0)).join('')||empty)+tg('o',bought.length)+(WSH.o?bought.map(x=>wOth(x,1)).join(''):''))
  +W(ownName+"'s list",`<div class="row" style="gap:8px;margin:10px 0 4px"><input id="wnew" placeholder="Add something you want" onkeydown="if(event.key==='Enter')wAdd()"><button class="go" style="width:auto;margin:0;padding:12px 18px" onclick="wAdd()">Add</button></div>`+(open.map(x=>wOwn(x,0)).join('')||empty)+tg('m',got.length)+(WSH.m?got.map(x=>wOwn(x,1)).join(''):''))}
function wishIn(row){const m=(row&&row.data&&row.data.meishe&&row.data.meishe.wish)||[];if(JSON.stringify(m)!==JSON.stringify(S.wishM||[])){S.wishM=m;persist();if(S.tab==='wish'&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName))render()}}
function wish(){const W=(t,b)=>`<div class="card"><b>${esc(t)}</b>${b}</div>`;
 return`${hero('hero-wish.jpg','1000/778','Wish List','JOSH &amp; MEISHE',.96,'b')}<div class="sub">Edit your own list. Hers is view-only: tick an item when you buy it and it disappears from your view (she won't see that).</div>${wishCards(W,'Josh','Meishe')}`}
function render(){autoFast();const y=scrollY;BGI=null;const html=(S.tab==='today'?'':hdr())+{today:todayV,spend,food,faith,fit,wish}[S.tab]();document.getElementById('app').innerHTML=html;const bg=document.getElementById('bg');bg.style.backgroundImage=BGI?`url(${BGI[0]})`:'none';bg.style.aspectRatio=BGI?BGI[1]:'auto';bg.style.height=BGI?'':'0';bg.style.top=(BGI?BGI[3]:0)+'px';const ht=document.querySelector('.ht');if(ht&&BGI){const top=ht.getBoundingClientRect().top+scrollY;ht.style.height=Math.max(64,BGI[2]*bg.offsetHeight+BGI[3]-top-12)+'px'}
 document.getElementById('nav').innerHTML=Object.entries(TABS).map(([k,v])=>`<button class="${S.tab===k?'on':''}" onclick="S.tab='${k}';save();render();scrollTo(0,0)"><span>${ICON[k]}</span>${v[1]}</button>`).join('');scrollTo(0,y)}
render();
(AU?sync():Promise.resolve()).then(()=>save());if(AU)bankSync(true);
document.addEventListener('visibilitychange',()=>{if(AU&&!document.hidden){sync().then(()=>save());bankSync(true)}});window.addEventListener('online',()=>{if(AU)sync()});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
try{if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js')}catch(e){}
