<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Discipline</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<meta name="theme-color" content="#F3EFE6"><link rel="icon" type="image/png" href="icon-192.png"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Discipline">
<style>
:root{--bg:#F3EFE6;--side:#EFEADF;--card:#FFFCF6;--ln:#E2DACA;--ln2:#EEE8DC;--tx:#1E2630;--mu:#5B6573;--mu2:#4A5563;--ac:#2D5A4A;--on-ac:#fff;--ac-soft:#DCE8E1;--ac-mid:#8DB09F;--ac-pale:#C9D8CF;--warn:#B04A24;--warn-soft:#F6E3D8;--warn-pale:#E7C2B1;--chip:#EFEADF;--inp:#fff;--none:#E3DDD0;--fut:#EFEADF;--fh:Fraunces,Georgia,serif;--fhw:600;--fhx:none;--fhs:-0.02em;--heroF:grayscale(1) sepia(.35) contrast(1.05);color-scheme:light}
[data-theme=night]{--bg:#0D1117;--side:#10151C;--card:#151B23;--ln:#263040;--ln2:#222B37;--tx:#E8EDF3;--mu:#9AA7B5;--mu2:#C9D2DC;--ac:#F0B44C;--on-ac:#1A1206;--ac-soft:rgba(240,180,76,.16);--ac-mid:#8A6A2E;--ac-pale:#3A3220;--warn:#E8836A;--warn-soft:rgba(232,131,106,.14);--warn-pale:#5A3238;--chip:#1B222C;--inp:#0F141A;--none:#222A35;--fut:#1A212B;--fh:"Barlow Condensed",Inter,sans-serif;--fhw:700;--fhx:uppercase;--fhs:.04em;--heroF:grayscale(.9) sepia(.2) brightness(.7);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 Inter,system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%}
a{color:var(--ac)}
button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;font-family:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.mu{color:var(--mu);font-size:13px}.mu2{color:var(--mu2)}
.g{color:var(--ac)}.r{color:var(--warn)}
#shell{display:flex;min-height:100vh}
#side{display:none;width:236px;flex:none;background:var(--side);border-right:1px solid var(--ln);padding:26px 16px;flex-direction:column;gap:24px;position:sticky;top:0;height:100vh;overflow-y:auto}
#app{flex:1;min-width:0;max-width:1320px;padding:16px 14px 110px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
#bnav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;background:var(--card);border-top:1px solid var(--ln);padding:4px 4px max(8px,calc(env(safe-area-inset-bottom,0px) - 8px))}
#bnav button{flex:1;background:none;border:0;color:var(--mu);font-size:10.5px;font-weight:600;padding:6px 0 2px;display:flex;flex-direction:column;align-items:center;gap:2px}
#bnav button.on{color:var(--ac)}
#mtop{display:flex;align-items:center;gap:8px;padding-top:env(safe-area-inset-top,0px)}
@media(min-width:900px){#side{display:flex}#bnav,#mtop{display:none}#app{padding:30px 40px 56px;gap:22px}}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px;font-family:var(--fh);font-weight:var(--fhw);font-size:19px;text-transform:var(--fhx);letter-spacing:var(--fhs)}
.logo{width:34px;height:34px;border-radius:9px;background:var(--tx);color:var(--bg);display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.navi{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--mu2);text-decoration:none;background:none;border:0;font-size:15px;width:100%;text-align:left}
.navi.on{background:var(--card);color:var(--tx);font-weight:600;box-shadow:0 1px 0 var(--ln)}
.ic{width:18px;height:18px;flex:none}
.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:18px}
@media(min-width:900px){.card{padding:20px}}
h1,h2,h3{font-family:var(--fh);font-weight:var(--fhw);text-transform:var(--fhx);letter-spacing:var(--fhs);margin:0}
h1{font-size:30px;line-height:1.08}@media(min-width:900px){h1{font-size:40px}}
h2{font-size:20px}
.ovl{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--warn);font-weight:700}
.hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.hero{display:flex;flex-wrap:wrap;gap:22px;align-items:stretch}
.hero .tx{flex:1 1 360px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.hero figure{flex:1 1 320px;margin:0;position:relative;min-height:170px;border-radius:18px;overflow:hidden;background:var(--none)}
@media(min-width:900px){.hero figure{min-height:250px}}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:var(--heroF)}
.hero figcaption{position:absolute;left:12px;bottom:10px;padding:3px 10px;border-radius:999px;background:var(--card);opacity:.9;font-size:12px}
.stats{display:flex;flex-wrap:wrap;gap:18px;align-items:center;margin-top:4px}
.stat b{display:block;font-family:var(--fh);font-weight:var(--fhw);font-size:26px;line-height:1.1}
.stat span{font-size:13px;color:var(--mu2)}
.vr{width:1px;align-self:stretch;background:var(--ln)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:14px 15px;display:flex;flex-direction:column;gap:5px;cursor:pointer;text-align:left;color:inherit;font:inherit}
.tl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--mu2);display:flex;justify-content:space-between}
.big{font-family:var(--fh);font-weight:var(--fhw);font-size:28px;letter-spacing:-.01em;line-height:1.1}
.axis{display:flex;justify-content:space-between;font-size:10px;color:var(--mu)}
.spark{width:100%;display:block}
.cols{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.c3{flex:3 1 460px;min-width:0}.c2{flex:2 1 320px;min-width:0;display:flex;flex-direction:column;gap:16px}.c1{flex:1 1 280px;min-width:0}
.it{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--ln2)}
.it:first-of-type{border-top:0}
.it .bd{flex:1;min-width:0}
.it .t{font-weight:600}
.it .s{font-size:12.5px;color:var(--mu)}
.mk{width:24px;height:24px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:transparent;box-shadow:inset 0 0 0 2px var(--ln)}
.mk.done{background:var(--ac);color:var(--on-ac);box-shadow:none}
.mk.min{background:var(--ac-soft);color:var(--ac);box-shadow:inset 0 0 0 2px var(--ac)}
.mk.late{background:var(--warn-soft);color:var(--warn);box-shadow:inset 0 0 0 2px var(--warn)}
.chip{min-height:38px;padding:0 13px;border-radius:999px;border:1px solid var(--ln);background:var(--card);color:var(--tx);font-size:13px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--tx);border-color:var(--tx);color:var(--bg)}
.chip.ac{background:var(--ac);border-color:var(--ac);color:var(--on-ac)}
.chip.sm{min-height:32px;padding:0 10px;font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.seg{display:inline-flex;border:1px solid var(--ln);border-radius:10px;overflow:hidden;flex:none}
.seg button{min-height:38px;padding:0 11px;border:0;background:var(--card);color:var(--mu2);font-size:12.5px;font-weight:600}
.seg button+button{border-left:1px solid var(--ln)}
.seg button.on{background:var(--ac);color:var(--on-ac)}
.seg button.on.no{background:var(--warn);color:#fff}
input,select,textarea{font:15px Inter,sans-serif;color:var(--tx);background:var(--inp);border:1px solid var(--ln);border-radius:10px;padding:9px 10px;min-height:40px;min-width:0;max-width:100%}
input[type=time],input[type=date]{-webkit-appearance:none;appearance:none}
input.sm{width:96px}input.xs{width:76px}
.go{min-height:46px;padding:0 18px;border:0;border-radius:12px;background:var(--tx);color:var(--bg);font-weight:700;font-size:15px}
.go.ac{background:var(--ac);color:var(--on-ac)}
.go.w{width:100%}
.bar{height:8px;border-radius:4px;background:var(--ln2);overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}.bar.over i{background:var(--warn)}
.sq{aspect-ratio:1/1;border-radius:4px;background:var(--fut)}
.sq.full{background:var(--ac)}.sq.min{background:var(--ac-mid)}.sq.miss{background:var(--warn-pale)}.sq.none{background:var(--none)}.sq.today{background:var(--card);box-shadow:inset 0 0 0 2px var(--warn)}
.lg{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.note{display:flex;gap:10px;font-size:14px;line-height:1.5;padding:4px 0}
.note i{flex:none;width:8px;height:8px;border-radius:2px;margin-top:7px}
.set{min-width:50px;min-height:46px;border-radius:10px;border:1px solid var(--ln);background:var(--chip);color:var(--mu);font:700 15px "JetBrains Mono",monospace}
.set.on{background:var(--ac);border-color:var(--ac);color:var(--on-ac)}
.stp{width:40px;height:40px;border-radius:10px;border:1px solid var(--ln);background:var(--card);color:var(--tx);font-size:18px;font-weight:600}
.kg{min-width:78px;text-align:center;font:700 16px "JetBrains Mono",monospace}
.ex{padding:14px 0;border-top:1px solid var(--ln2);display:flex;flex-direction:column;gap:8px}
.wk{display:grid;grid-template-columns:minmax(110px,170px) repeat(7,minmax(0,1fr)) 46px;gap:5px;align-items:center}
.cell{height:24px;border-radius:6px;background:var(--fut)}
.cell.ok{background:var(--ac)}.cell.min{background:var(--ac-mid)}.cell.bad{background:var(--warn-pale)}.cell.na{background:var(--none)}
.links{display:flex;flex-wrap:wrap;gap:8px}
.lk{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:12px;border:1px solid var(--ln);background:var(--card);color:var(--tx);text-decoration:none;font-weight:600;font-size:14px}
.lk:hover{border-color:var(--ac)}
.day{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;padding:9px 6px;border-top:1px solid var(--ln2);align-items:center}
.day.td{background:var(--bg);border-radius:10px;border-top-color:transparent}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20}
@media(min-width:900px){.toast{bottom:28px}}
.x{background:none;border:0;color:var(--mu);font-size:18px;padding:4px 8px;min-width:34px;min-height:34px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.f2 .w{grid-column:1/3}
.sw{display:flex;flex-direction:column;align-items:center;gap:8px}
.swb{min-height:44px;border:0;border-radius:12px;font-weight:700;font-size:14px;flex:1}
.wl{display:inline-block;padding:6px 10px;border-radius:999px;background:var(--ac);color:var(--on-ac);text-decoration:none;font-size:12px;font-weight:600;margin:0 2px}
input.ck{width:22px;height:22px;min-height:22px;min-width:22px;flex:0 0 22px;padding:0;accent-color:var(--ac)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body>
<div id="shell"><nav id="side" aria-label="Main"></nav><main id="app"></main></div>
<nav id="bnav" aria-label="Main"></nav>
<script>
/* ---------- basics ---------- */
const $=id=>document.getElementById(id);
const iso=d=>{const z=new Date(d);return z.getFullYear()+'-'+String(z.getMonth()+1).padStart(2,'0')+'-'+String(z.getDate()).padStart(2,'0')};
let today=iso(new Date());
const addD=(d,n)=>{const z=new Date(d+'T12:00');z.setDate(z.getDate()+n);return iso(z)};
const dow=d=>new Date(d+'T12:00').getDay();
const wkStart=d=>addD(d,-dow(d));
const dl=d=>'SMTWTFS'[dow(d)];
const DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const md=d=>MON[+d.slice(5,7)-1]+' '+(+d.slice(8));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>(n<0?'−':'')+'$'+Math.abs(n).toFixed(2);
const money0=n=>(n<0?'−':'')+'$'+Math.round(Math.abs(n));
const uid=()=>Math.random().toString(36).slice(2);
const nowT=()=>{const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const mins=t=>{const m=/^(\d{1,2}):(\d{2})/.exec(t||'');return m?(+m[1])*60+(+m[2]):null};
const tdisp=m=>{if(m==null)return'–';m=Math.round(m);const h=Math.floor(m/60)%24,mm=String(((m%60)+60)%60).padStart(2,'0');return((h%12)||12)+':'+mm};
const dur=m=>Math.floor(m/60)+':'+String(m%60).padStart(2,'0');
const sum=(a,f)=>a.reduce((s,x)=>s+(f?f(x):x),0);
const median=a=>{if(!a.length)return null;const s=[...a].sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2};
const sd=a=>{if(a.length<2)return null;const m=sum(a)/a.length;return Math.sqrt(sum(a,x=>(x-m)**2)/a.length)};
const lastN=(n,end)=>{const e=end||today,a=[];for(let i=n-1;i>=0;i--)a.push(addD(e,-i));return a};
const svg=p=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const ICON={today:svg('<path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/>'),train:svg('<path d="M6 6v12M3 9v6M18 6v12M21 9v6M6 12h12"/>'),rise:svg('<path d="M2 18h20M6 18a6 6 0 0 1 12 0M12 3v4M4.2 9.2l2.1 2.1M19.8 9.2l-2.1 2.1"/>'),money:svg('<circle cx="12" cy="12" r="9"/><path d="M14.6 9.2c-.5-1-1.5-1.6-2.7-1.6-1.5 0-2.5.8-2.5 2s1 1.7 2.7 2.1c1.7.4 2.7.9 2.7 2.1s-1 2-2.7 2c-1.3 0-2.4-.6-2.8-1.7M12 5.5v13"/>'),spirit:svg('<path d="M3 5c3-1.6 6-1.6 9 0 3-1.6 6-1.6 9 0v14c-3-1.6-6-1.6-9 0-3-1.6-6-1.6-9 0zM12 5v14"/>'),wish:svg('<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M5 12v9h14v-9M7.5 8a2.5 2.5 0 1 1 0-5C10 3 12 8 12 8s2-5 4.5-5a2.5 2.5 0 1 1 0 5"/>'),week:svg('<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>'),gear:svg('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>'),check:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',ext:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>'};
const LINKS={cfm:'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026?lang=eng',scrip:'https://www.churchofjesuschrist.org/study/scriptures?lang=eng',russian:'https://joshp523.github.io/russian/',writing:'https://joshp523.github.io/writing-app/'};
const lk=(u,t)=>`<a class="lk" href="${u}" target="_blank" rel="noopener">${t} ${ICON.ext}</a>`;

/* ---------- state ---------- */
let S={tab:'today',spend:[],food:{},faith:{},fx:{},start:3590.06,budget:200};
try{const r=localStorage.getItem('habits2');if(r)S=JSON.parse(r)}catch(e){}
try{const k=JSON.parse(localStorage.getItem('dd_wish_bk')||'null');if(k){S.wish=wMerge(S.wish,k.w);S.wishB=bMerge(S.wishB,k.b)}}catch(e){}
function defaults(){S.spend=S.spend||[];S.food=S.food||{};S.faith=S.faith||{};S.fx=S.fx||{};S.budget=S.budget||200;S.caps=S.caps||[0,90,40];S.netLog=S.netLog||{};S.glide=S.glide||{start:'2026-11-16',first:465,step:15,goal:390};S.week=S.week||{};S.ifthen=S.ifthen||['my alarm rings → feet on the floor and curtains open before I touch my phone','it is 10:00 PM → phone on the kitchen charger, pick up a book','I miss a workout → tomorrow I do the 10-minute minimum, so I never miss twice'];S.theme=S.theme||'auto';const m={spend:'money',faith:'spirit',fit:'train',food:'today'};if(m[S.tab])S.tab=m[S.tab];if(!PAGES[S.tab])S.tab='today'}
const persist=()=>{try{localStorage.setItem('habits2',JSON.stringify(S))}catch(e){}try{const k=JSON.parse(localStorage.getItem('dd_wish_bk')||'{}');localStorage.setItem('dd_wish_bk',JSON.stringify({w:wMerge(k.w,S.wish),b:bMerge(k.b,S.wishB)}))}catch(e){}};
const save=()=>{const h=hs(JSON.stringify(payload()));if(h!==S.h){S.h=h;S.dirty=true;pushSoon()}persist()};
function toast(m){let t=$('toast');if(!t){t=document.createElement('div');t.id='toast';t.className='toast';t.setAttribute('role','status');document.body.appendChild(t)}t.textContent=m;t.style.opacity=1;clearTimeout(t.h);t.h=setTimeout(()=>t.style.opacity=0,2400)}
/* old data migration (fitness entries from very first version) */
function fmig(){Object.values(S.fx||{}).forEach(x=>{if(x.type){if(x.type==='weights')x.lift='weights';else if(x.type==='run')x.run=true;else if(x.type==='rest')x.rest=true;delete x.type}(x.ex||[]).forEach(e=>{if(!e.s){const g=parseT(e.t);e.s=Array(g.n).fill(e.r?(g.hi||1):null);delete e.r}})})}

/* ---------- seasons ---------- */
const SEASONS=[{n:1,a:'2026-10-05',b:'2026-11-27'},{n:2,a:'2026-12-01',b:'2027-01-23'},{n:3,a:'2027-01-25',b:'2027-03-19'}];
const HERO={today:'hero-today.jpg',train:'hero-fit.jpg',rise:'hero-faith.jpg',money:'hero-spend.jpg',spirit:'hero-food.jpg',wish:'hero-wish.jpg',week:'hero-today.jpg',settings:'hero-spend.jpg'};
const UNL=[['hero-today.jpg','Iwo Jima'],['hero-spend.jpg','Apollo 11'],['hero-food.jpg','Wilderness'],['hero-fit.jpg','Normandy'],['hero-faith.jpg','The Temple']];
function season(d){d=d||today;for(const s of SEASONS)if(d>=s.a&&d<=s.b)return{...s,day:Math.round((new Date(d)-new Date(s.a))/864e5)+1,on:true};const nx=SEASONS.find(s=>s.a>d);const pv=[...SEASONS].reverse().find(s=>s.b<d);return{...(pv||SEASONS[0]),next:nx,on:false,day:54}}

/* ---------- RISE ---------- */
const wakeM=d=>mins((S.faith[d]||{}).wk);
const loM=d=>mins((S.faith[d]||{}).lo);

async function bankSync(silent){if(!AU||busyB)return;if(silent&&S.bankAt&&Date.now()-S.bankAt<6e5)return;busyB=true;
 try{await bankFlush();const j=await pcall({action:'sync'});S.plaidOn=!!j.linked;const fl=S.bankFrom=S.bankFrom||'2026-09-21',ack=[];let n=0,tr=0;
  for(const x of (j.txns||[])){if((S.ackQ||[]).includes(x.id))continue;ack.push(x.id);if(x.date<fl)continue;const amt=Math.round(+x.amount*100)/100;
   if(!(amt>0)||TRANSFER.test(x.name||'')){tr++;continue}
   if(S.spend.some(s=>s.bid===x.id))continue;S.spend.push({id:uid(),t:x.name,a:amt,d:x.date,c:'Spent',src:'bank',bid:x.id});n++}
  if(ack.length)S.ackQ=(S.ackQ||[]).concat(ack);if(n)save();S.bankAt=Date.now();S.bankErr='';persist();if(ack.length)bankFlush();if(j.linked)await bankBal();
  if(S.tab==='money'&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))render();
  if(!silent)toast(j.linked?(n?n+' purchase'+(n>1?'s':'')+' added':'Up to date')+(tr?' · '+tr+' transfers/deposits skipped':''):'No bank connected')}
 catch(e){if(e.message!=='off'){S.bankErr=e.message.slice(0,140);persist();if(!silent)toast(S.bankErr)}}
 busyB=false}
async function bankConnect(upd){if(!AU)return toast('Sign in first (Settings)');
 try{toast('Opening bank link…');await loadPlaid();const j=await pcall({action:'link_token',update:!!upd});if(!j.link_token)throw new Error('The plaid function did not return a link token.');
  Plaid.create({token:j.link_token,onSuccess:async pt=>{try{if(!upd)await pcall({action:'exchange',public_token:pt});S.plaidOn=true;S.bankAt=0;S.bankErr='';persist();toast('Bank connected ★');await bankSync();render()}catch(e){toast(e.message.slice(0,90))}},onExit:err=>{if(err)toast((err.display_message||err.error_message||'Link closed').slice(0,90))}}).open()}
 catch(e){toast(e.message.slice(0,90))}}
async function bankUnlink(){if(!confirm('Disconnect the bank? You can reconnect later.'))return;try{await pcall({action:'unlink'});S.plaidOn=false;S.ackQ=[];S.bankErr='';S.acct=[];save();render();toast('Disconnected')}catch(e){toast(e.message.slice(0,90))}}
async function bankReplace(){const from=S.bankFrom||'2026-09-21';
 if(!confirm('This DELETES all '+S.spend.length+' purchases and rebuilds them from the bank, dated '+from+' or later. A CSV backup downloads first. Continue?'))return;
 try{try{localStorage.setItem('dd_spend_backup',JSON.stringify(S.spend))}catch(e){}csvOut();S.spend=[];S.ackQ=[];S.bankAt=0;save();await pcall({action:'resetall'});await bankSync(false);render();toast('Rebuilt from bank ★ '+S.spend.length+' purchases')}
 catch(e){toast(e.message.slice(0,90))}}
function bankUI(){if(!AU)return card('Bank',`<div class="mu">Sign in (Settings) to pull purchases in automatically.</div>`);
 if(!S.plaidOn)return card('Bank',`<div class="mu" style="margin-bottom:8px">Pull purchases in automatically. Link checking <b>and</b> your credit card so card purchases are counted when you make them.</div>${S.bankErr?`<div class="mu r">${esc(S.bankErr)}</div>`:''}<button class="go ac w" onclick="bankConnect()">Connect bank</button>`);
 return card('Bank',`${S.bankErr?`<div class="mu r" style="margin-bottom:6px">${esc(S.bankErr)}</div>`:''}${S.acctErr?`<div class="mu r" style="margin-bottom:6px">Balance: ${esc(S.acctErr)}</div>`:''}<div class="chips"><button class="chip sm ac" onclick="bankSync()">Sync purchases</button><button class="chip sm" onclick="bankBal(false,true)">Balances</button><button class="chip sm" onclick="bankConnect(true)">Reconnect</button></div><div class="row" style="margin-top:10px;flex-wrap:wrap"><span class="mu">Import from</span><input type="date" style="width:150px" value="${esc(S.bankFrom||'2026-09-21')}" onchange="S.bankFrom=this.value;persist()"></div><div class="row" style="margin-top:10px;flex-wrap:wrap"><span class="mu">${S.bankAt?'Updated '+new Date(S.bankAt).toTimeString().slice(0,5):''}</span><span class="chips"><button class="chip sm" onclick="bankReplace()">Start over</button><button class="chip sm" onclick="bankUnlink()">Disconnect</button></span></div>`,'transfers & deposits skipped')}

/* ---------- WISH LIST (shared with Meishe's app) ---------- */
const OK='wishM';
function wMerge(a,b){const m=new Map();[...(a||[]),...(b||[])].forEach(it=>{if(!it||!it.id)return;const o=m.get(it.id);if(!o||(it.t||0)>(o.t||0))m.set(it.id,it)});return[...m.values()].sort((x,y)=>(y.c||0)-(x.c||0))}
function bMerge(a,b){const m=new Map();[...(a||[]),...(b||[])].map(x=>typeof x==='string'?{i:x,on:1,t:0}:x).forEach(x=>{if(!x||!x.i)return;const o=m.get(x.i);if(!o||(x.t||0)>=(o.t||0))m.set(x.i,x)});return[...m.values()]}
function bSet(){return new Set(bMerge(S.wishB,[]).filter(x=>x.on).map(x=>x.i))}
function wSig(l){return JSON.stringify((l||[]).filter(x=>x&&x.id).map(x=>[x.id,x.t||0,x.x||0,x.g||0,x.n||'',x.u||'']).sort())}
function bSig(l){return JSON.stringify(bMerge(l,[]).map(x=>[x.i,x.on?1:0,x.t||0]).sort())}
let WE=null,WSH={};
const wurl=u=>{u=String(u||'').trim();if(!u)return'';if(!/^[a-z][a-z0-9+.-]*:/i.test(u))u='https://'+u;try{const x=new URL(u);return/^https?:$/.test(x.protocol)?x.href:''}catch(e){return''}};
const wBtn=u=>u?`<a class="wl" href="${esc(u)}" target="_blank" rel="noopener noreferrer">Open link</a>`:'';
function wAdd(){const i=$('wnew'),n=i.value.trim();if(!n)return;(S.wish=S.wish||[]).unshift({id:uid(),n,u:'',c:Date.now(),t:Date.now()});i.value='';save();render()}
function wEdit(id){WE=id;render()}
function wSave(id){const it=(S.wish||[]).find(x=>x.id===id);if(!it)return;const n=$('wn').value.trim(),raw=$('wu').value.trim(),u=wurl(raw);if(raw&&!u)return toast("That link doesn't look right");if(n)it.n=n;it.u=u;it.t=Date.now();WE=null;save();render()}
function wDel(id){const it=(S.wish||[]).find(x=>x.id===id);if(it){it.x=1;it.t=Date.now()}WE=null;save();render()}
function wGot(id,on){const it=(S.wish||[]).find(x=>x.id===id);if(it){it.g=on?1:0;it.t=Date.now();save();render();if(on)toast('Marked as purchased ★')}}
function wBuy(id,on){S.wishB=bMerge(S.wishB,[{i:id,on:on?1:0,t:Date.now()}]);save();render();if(on)toast('Hidden from your view ★')}
function wTog(k){WSH[k]=!WSH[k];render()}
const wTxt=(t,d)=>`<span style="overflow-wrap:anywhere${d?';text-decoration:line-through;opacity:.55':''}">${esc(t)}</span>`;
const wOwn=(it,d)=>WE===it.id?`<div class="it" style="flex-direction:column;align-items:stretch"><input id="wn" value="${esc(it.n)}" placeholder="Item name"><input id="wu" value="${esc(it.u)}" placeholder="Link (optional)" inputmode="url" autocapitalize="off" autocorrect="off" style="margin-top:6px"><div class="row" style="margin-top:8px"><button class="chip sm" onclick="wDel('${it.id}')">Delete</button><button class="chip sm on" onclick="wSave('${it.id}')">Save</button></div></div>`:`<div class="it"><input type="checkbox" class="ck" ${d?'checked':''} onchange="wGot('${it.id}',this.checked)" aria-label="Got it"><div class="bd">${wTxt(it.n,d)}</div>${it.u?wBtn(it.u):`<button class="chip sm" onclick="wEdit('${it.id}')">+ Link</button>`}<button class="x" aria-label="Edit" onclick="wEdit('${it.id}')">✎</button></div>`;
const wOth=(it,d)=>`<div class="it"><input type="checkbox" class="ck" ${d?'checked':''} onchange="wBuy('${it.id}',this.checked)" title="I bought this" aria-label="I bought this"><div class="bd">${wTxt(it.n,d)}</div>${wBtn(it.u)}</div>`;
function wishIn(row){const d=(row&&row.data)||{},m=(d.meishe&&d.meishe.wish)||[];let ch=false;
 if(JSON.stringify(m)!==JSON.stringify(S.wishM||[])){S.wishM=m;ch=true}
 if(row){const mw=wMerge(S.wish,d.wishJ),mb=bMerge(S.wishB,d.wishJb);
  if(wSig(mw)!==wSig(S.wish)){S.wish=mw;ch=true}if(bSig(mb)!==bSig(S.wishB)){S.wishB=mb;ch=true}
  if(wSig(mw)!==wSig(d.wishJ)||bSig(mb)!==bSig(d.wishJb))S.wfix=true}
 if(ch){persist();if(S.tab==='wish'&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName))render()}}
function wishV(){const mine=(S.wish||[]).filter(x=>!x.x),open=mine.filter(x=>!x.g),got=mine.filter(x=>x.g);
 const B=bSet(),oth=(S[OK]||[]).filter(x=>!x.g&&!x.x),vis=oth.filter(x=>!B.has(x.id)),bought=oth.filter(x=>B.has(x.id));
 const tg=(k,n)=>n?`<div style="margin-top:10px"><button class="chip sm" onclick="wTog('${k}')">${WSH[k]?'Hide':'Show'} purchased (${n})</button></div>`:'';
 const empty='<div class="mu" style="margin-top:8px">Nothing here yet</div>';
 return hero('wish','Josh &amp; Meishe','Wish lists.','Edit your own list. Hers is view-only: tick an item when you buy it and it disappears from your view (she won’t see that).','','Jeep, 1940s')+`<div class="cols"><div class="c1">${card("Meishe's list",(vis.map(x=>wOth(x,0)).join('')||empty)+tg('o',bought.length)+(WSH.o?bought.map(x=>wOth(x,1)).join(''):''))}</div><div class="c1">${card("Josh's list",`<div class="row" style="gap:8px;margin:4px 0 8px"><input id="wnew" placeholder="Add something you want" onkeydown="if(event.key==='Enter')wAdd()" style="flex:1"><button class="go ac" onclick="wAdd()">Add</button></div>`+(open.map(x=>wOwn(x,0)).join('')||empty)+tg('m',got.length)+(WSH.m?got.map(x=>wOwn(x,1)).join(''):''))}</div></div>`}

/* ---------- boot ---------- */
defaults();fmig();
render();
setInterval(()=>{const n=iso(new Date());const th=document.documentElement.dataset.theme,want=(S.theme==='night'||(S.theme==='auto'&&(new Date().getHours()>=20||new Date().getHours()<5)))?'night':'day';if((n!==today||th!==want)&&!/INPUT|SELECT|TEXTAREA/.test((document.activeElement||{}).tagName||''))render()},60000);
document.addEventListener('focusout',()=>setTimeout(()=>{if(!/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||'')){const y=scrollY;scrollTo(0,y+1);scrollTo(0,y)}},150));
(AU?sync():Promise.resolve()).then(()=>save());if(AU)bankSync(true);
document.addEventListener('visibilitychange',()=>{if(AU&&!document.hidden){sync().then(()=>save());bankSync(true)}});window.addEventListener('online',()=>{if(AU)sync()});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
try{if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js')}catch(e){}
</script></body></html>
