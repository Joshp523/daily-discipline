<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Discipline</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Condensed:wght@500;700&family=Roboto+Mono:wght@500;700&display=swap"><meta name="theme-color" content="#06090f"><link rel="icon" type="image/png" href="icon-192.png"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Discipline"><style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:dark;--bg:#06090f;--card:#0d1424;--tx:#e9edf5;--mu:#8793ab;--ln:#1c2740;--ac:#4a86dc;--ac2:#162a4d;--red:#b3122c;--bad:#ff5468;--flagR:#a50f1f;--flagB:#0a2a5e;--blue:#12397a;--ok:#3fb868}
*{box-sizing:border-box}
html,body{margin:0;color:var(--tx);font:16px/1.4 Roboto,"Helvetica Neue",Arial,sans-serif}
body{background:radial-gradient(900px 320px at 50% -120px,#17306a66,transparent 70%),var(--bg)}
main{max-width:520px;margin:0 auto;padding:14px 16px 110px}
h1,.hdr,nav button,.chip,.card>b:first-child,.card>.row:first-child>b{font-family:"Roboto Condensed",Roboto,Arial,sans-serif}
h1{font-size:26px;margin:6px 0 2px;text-transform:uppercase;letter-spacing:.09em;font-weight:700}
.sub{color:var(--mu);font-size:13px;margin-bottom:14px}
.hdr{display:flex;align-items:center;gap:10px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;padding-bottom:10px;border-bottom:1px solid var(--ln);margin-bottom:10px}.hdr span:last-child{margin-left:auto;color:var(--mu)}.hdr svg{width:34px;height:18px;border-radius:2px}
.hero{position:relative;height:124px;border-radius:12px;overflow:hidden;margin:4px 0 14px;border:1px solid var(--ln)}.hero svg{position:absolute;inset:0;width:100%;height:100%;opacity:.85}
.hero .ov{position:absolute;inset:0;padding:14px;display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(0deg,#06090ff0,#06090f22 75%)}
.hero .k{font:700 11px "Roboto Mono",monospace;letter-spacing:.16em;color:#ffb3bd}.hero .t{font:700 28px "Roboto Condensed",sans-serif;letter-spacing:.1em;text-transform:uppercase}
.card{background:var(--card);border:1px solid var(--ln);border-left:3px solid var(--red);border-radius:12px;padding:14px;margin-bottom:12px}
.card>b:first-child,.card>.row:first-child>b{text-transform:uppercase;letter-spacing:.1em;font-size:13px;color:#cfd6e6}
.big{font:700 30px "Roboto Mono",monospace;letter-spacing:-1px}.mu{color:var(--mu);font-size:13px}
.bar{height:10px;background:var(--ln);border-radius:3px;overflow:hidden;margin:10px 0 6px}.bar i{display:block;height:100%;background:var(--ac)}.bar.over i{background:var(--bad)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.item{padding:10px 0;border-top:1px solid var(--ln)}.item:first-child{border-top:0}
.x{background:none;border:0;color:var(--mu);font-size:18px;padding:4px 8px}
input,select,textarea{width:100%;padding:12px;border-radius:8px;border:1px solid var(--ln);background:#0a101d;color:var(--tx);font:16px Roboto,Arial,sans-serif}
.f{display:grid;grid-template-columns:1fr 1fr;gap:8px}.f .w{grid-column:1/3}
button.go{width:100%;padding:13px;border:0;border-radius:8px;background:var(--red);color:#fff;font:700 15px "Roboto Condensed",sans-serif;letter-spacing:.12em;text-transform:uppercase;margin-top:8px}
.chart{display:flex;align-items:flex-end;gap:6px;height:70px;margin-top:10px;position:relative}.chart div{flex:1;text-align:center;font-size:11px;color:var(--mu)}
.chart span{display:block;background:var(--ac2);border-radius:3px 3px 0 0;min-height:3px}.chart .ok span{background:var(--ok)}
.gl{position:absolute;left:0;right:0;border-top:1px dashed var(--red);pointer-events:none}
nav{position:fixed;left:0;right:0;bottom:0;background:#080d18;border-top:1px solid var(--ln);display:flex;padding:0 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;border:0;color:var(--mu);font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:8px 0 4px;box-shadow:inset 0 2px 0 transparent}nav button span{display:block}nav .ic{width:24px;height:24px;margin:0 auto 2px}
nav button.on{color:#fff;font-weight:700;box-shadow:inset 0 2px 0 var(--red)}
.dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{padding:9px 13px;border-radius:6px;border:1px solid var(--ln);background:#0a101d;color:var(--tx);font-size:13px;letter-spacing:.05em;text-transform:uppercase}.chip.on{background:var(--blue);border-color:var(--ac);color:#fff}
.sets{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.chip.set{min-width:54px;padding:11px 0;text-align:center;opacity:.65;font:700 15px "Roboto Mono",monospace}.chip.set.on{opacity:1}
.kg{width:68px!important;padding:8px!important;display:inline-block}
.dt{display:block;height:16px;border-radius:3px;background:var(--ln)}.dt.ok{background:var(--ok)}.dt.bad{background:var(--bad)}
.wk{display:grid;grid-template-columns:64px repeat(7,1fr);gap:6px;align-items:center}
.strip{display:flex;gap:6px;overflow-x:auto}.strip .chip{flex:0 0 auto;padding:7px 10px;text-align:center;line-height:1.25}
.ic{width:20px;height:20px}.card .ic{width:16px;height:16px;vertical-align:-3px;margin-right:6px}.chip .ic{width:14px;height:14px;margin:0;vertical-align:-2px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--red);color:#fff;padding:10px 16px;border-radius:6px;font:700 14px "Roboto Condensed",sans-serif;letter-spacing:.06em;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9}
</style></head>
<body><main id="app"></main>
<nav id="nav"></nav>
<script>
const TABS={today:['★','Today'],spend:['★','Spending'],food:['★','Food'],faith:['★','Faith'],fit:['★','Fitness']};
const svg=p=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const ICON={today:svg('<polygon points="12,2.5 14.8,9 21.5,9.5 16.3,14 18,21 12,17.3 6,21 7.7,14 2.5,9.5 9.2,9" fill="currentColor"/>'),spend:svg('<circle cx="12" cy="12" r="9"/><path d="M14.6 9.2c-.5-1-1.5-1.6-2.7-1.6-1.5 0-2.5.8-2.5 2s1 1.7 2.7 2.1c1.7.4 2.7.9 2.7 2.1s-1 2-2.7 2c-1.3 0-2.4-.6-2.8-1.7M12 5.5v13"/>'),food:svg('<path d="M6 3v7a2 2 0 0 0 4 0V3M8 3v18M17 3c-2.2 1.2-3 4-3 7h3v11"/>'),faith:svg('<path d="M3 5c3-1.6 6-1.6 9 0 3-1.6 6-1.6 9 0v14c-3-1.6-6-1.6-9 0-3-1.6-6-1.6-9 0zM12 5v14"/>'),fit:svg('<path d="M6 6v12M3 9v6M18 6v12M21 9v6M6 12h12"/>'),run:svg('<path d="M5 6l6 6-6 6M13 6l6 6-6 6"/>'),rest:svg('<path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/>')};
function flag(){let st='';for(let r=0;r<9;r++){const n=r%2?5:6;for(let k=0;k<n;k++){const cx=r%2?6.33*(2*k+2):6.33*(2*k+1),cy=5.4*(r+1);let p='';for(let i=0;i<10;i++){const a=Math.PI*i/5-Math.PI/2,q=i%2?0.75:1.9;p+=(cx+q*Math.cos(a)).toFixed(1)+','+(cy+q*Math.sin(a)).toFixed(1)+' '}st+=`<polygon points="${p}" fill="#fff"/>`}}
 let b='';for(let i=0;i<13;i++)b+=`<rect y="${(i*7.692).toFixed(2)}" width="190" height="7.7" fill="${i%2?'#f1f1f1':'var(--flagR)'}"/>`;
 return`<svg viewBox="0 0 190 100" preserveAspectRatio="xMidYMid slice">${b}<rect width="76" height="53.85" fill="var(--flagB)"/>${st}</svg>`}
const dayN=()=>Math.min(54,Math.max(1,Math.round((new Date(today)-new Date('2026-10-05'))/864e5)+1));
const hdr=()=>`<div class="hdr">${flag()}<span>Daily Discipline</span><span>Day ${dayN()}/54 <i class="dot sdot" style="background:${SYC[SY]};margin:0 0 0 6px"></i></span></div>`;
const CATS=[['Unavoidable Expenses','var(--ac)'],['Optional Stuff','#c9d1e3'],['Absolutely Frivolous Fun Stuff','#e0364f']];
const iso=d=>{const z=new Date(d);return z.getFullYear()+'-'+String(z.getMonth()+1).padStart(2,'0')+'-'+String(z.getDate()).padStart(2,'0')};
const today=iso(new Date());const money=n=>'$'+n.toFixed(2);const pc=n=>Math.round(n*100)+'%';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sn=c=>['Unavoidable','Optional','Frivolous'][CATS.findIndex(x=>x[0]===c)]||c;
const uid=()=>Math.random().toString(36).slice(2);
const SP="2026-09-27|chocolate|F|69.26;2026-09-30|croissant|O|1.14;2026-09-30|breakfast|O|6.52;2026-09-30|train from airport|U|11.28;2026-09-30|Lidl|U|15.95;2026-09-29|Lidl|U|25.76;2026-10-01|lidl|U|37.51;2026-10-01|lidl|U|5.16;2026-10-05|croissant|O|2;2026-10-05|carrefour|U|12.48;2026-10-05|transit|O|13.68;2026-10-05|lidl|U|25.54;2026-10-05|doner kebap|O|27.36;2026-10-05|train to brugge|O|37.17;2026-10-05|red bull|F|2.65;2026-10-06|lidl|U|32.1;2026-10-07|mobile data|O|10.59;2026-10-07|lidl|U|23.28;2026-10-07|used books|O|11.28;2026-10-07|Leather Jacket|F|56.95;2026-10-08|mushroom growing kit|F|36.96;2026-10-08|lidl|F|11.28;2026-10-08|coke zero lemon|F|1.12;2026-10-08|Lidl|U|15.25;2026-10-09|Irish Pub|O|24.81;2026-10-10|cash money ATM|O|97.84;2026-10-10|animal fries|F|8.43;2026-10-10|Lidl|O|4.98;2026-10-10|Lidl|U|40.28;2026-10-10|les petits Riens|O|82.08;2026-10-10|syrian desserts|F|12.7;2026-10-11|transit to church|U|9.45;2026-10-12|peter's birthday supplies|O|78.76;2026-10-12|purse & fries for meishe|F|24.63;2026-10-12|ferris wheel|F|22.49;2026-10-13|red bull|F|2.41;2026-10-13|baguettes, cocoa|O|10.07";
const FD="2026-10-09|8|1|3 eggs, bread, ham, cheese|Overfull|fish and chips|Satisfied|chicken pasta, creamed spinach|Satisfied;2026-10-10|7|0|croque|Full|fries, mayo, croissant, red bull|Satisfied|date roll and ice cream|Satisfied;2026-10-11|16|0||Satisfied|spam and rice|Satisfied|mashed potatoes|Full;2026-10-12|8|1|eggs, bread, yogurt|Satisfied|mashed potatoes, croissant, diet coke, milk|Full|bacon nacho fries|Satisfied;2026-10-13|11.5||apple and red bull|Satisfied|grilled cheese and tomato soup|Overfull|wok mix and rice, diet coke, milk|Full";
const FA="2026-10-05|30|10|20|0|0|270|Daily wire;2026-10-06|30|0|20|0|0|270|Daily wire;2026-10-07|30|10|0|0|0|270|Daily wire;2026-10-08|15|0|0|0|0|270|Daily wire;2026-10-09|15|0|0|0|15|141|DW, Tolstoy;2026-10-10|10|0|0|0|3|41|DW, Tolstoy;2026-10-11|30|30|0|25|30|0|lamb of god;2026-10-12|30|30|0|0|0|200|The office, DW;2026-10-13|30|30|0|10|50|140|GC, music, DW, office";
function seed(){const S={tab:'spend',spend:[],food:{},faith:{},fit:[],start:3590.06,budget:200,goal:30};
 SP.split(';').forEach(r=>{const p=r.split('|');S.spend.push({id:uid(),d:p[0],t:p[1],c:CATS['UOF'.indexOf(p[2])][0],a:+p[3]})});
 FD.split(';').forEach(r=>{const p=r.split('|');S.food[p[0]]={fh:+p[1],sn:p[2]===''?undefined:p[2]==='1',b:p[3],bs:p[4],l:p[5],ls:p[6],d:p[7],ds:p[8]}});
 FA.split(';').forEach(r=>{const p=r.split('|');S.faith[p[0]]={pers:+p[1],comp:+p[2],lang:+p[3],gtr:+p[4],up:+p[5],dis:+p[6],n:p[7]}});return S}
let S=seed();
try{const r=localStorage.getItem('habits2');if(r)S=JSON.parse(r)}catch(e){}
const persist=()=>{try{localStorage.setItem('habits2',JSON.stringify(S))}catch(e){}};
const save=()=>{const h=hs(JSON.stringify(payload()));if(h!==S.h){S.h=h;S.dirty=true;pushSoon()}persist()};
const days7=()=>{const a=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);a.push(iso(d))}return a};
const dl=d=>'SMTWTFS'[new Date(d+'T12:00').getDay()];
function chart(vals,mx,okf,goal){const D=days7();return'<div class="chart">'+(goal?`<i class="gl" style="bottom:${goal/mx*60+15}px"></i>`:'')+D.map((d,i)=>`<div class="${okf(vals[i])?'ok':''}"><span style="height:${Math.min(1,vals[i]/mx)*60}px"></span>${dl(d)}</div>`).join('')+'</div>'}
function setV(k,f,v){const e=(S[k][today]=S[k][today]||{}),b=k==='faith'?dayPct(e):0;e[f]=v;if(k==='food'&&['b','l','d'].includes(f)&&v&&!e[f+'t'])e[f+'t']=nowT();save();render();if(k==='faith'&&b<.8&&dayPct(e)>=.8){let n=0;for(const d of days7().reverse()){if(dayPct(S.faith[d])>=.8)n++;else break}toast('Target hit! '+n+'-day streak ★')}}
function setN(k,f,v){setV(k,f,v===''?undefined:+v)}
const num=(k,f,ph,step)=>`<input type="number" inputmode="decimal" step="${step||1}" placeholder="${ph}" value="${esc((S[k][today]||{})[f])}" onchange="setN('${k}','${f}',this.value)">`;
/* SPENDING */
function weekRange(){const d=new Date();d.setDate(d.getDate()-d.getDay());const e=new Date(d);e.setDate(d.getDate()+6);return[iso(d),iso(e)]}
function spend(){
 const[a,b]=weekRange();const wk=S.spend.filter(x=>x.d>=a&&x.d<=b);const tot=wk.reduce((s,x)=>s+x.a,0);
 const all=S.spend.reduce((s,x)=>s+x.a,0);const rem=S.budget-tot;
 const fr=S.spend.filter(x=>x.c===CATS[2][0]).reduce((s,x)=>s+x.a,0);
 const caps=S.caps||[0,90,40],exp=S.budget*(new Date().getDay()+1)/7,pace=tot<=exp?'On pace · '+money(exp-tot)+' of slack today':money(tot-exp)+' ahead of pace';const cn={};S.spend.forEach(x=>{const k=x.t.toLowerCase();cn[k]=(cn[k]||0)+1});const top=Object.keys(cn).filter(t=>!/['"]/.test(t)).sort((a,b)=>cn[b]-cn[a]).slice(0,5).map(t=>`<button class="chip" onclick="document.getElementById('t').value='${esc(t)}';sugCat('${esc(t)}')">${esc(t)}</button>`).join('');
 const cats=CATS.map(([n,c],i)=>{const v=wk.filter(x=>x.c===n).reduce((s,x)=>s+x.a,0),cp=caps[i];return`<div class="item"><div class="row"><span><i class="dot" style="background:${c}"></i>${sn(n)}</span><span><b>${money(v)}</b>${i?` / <input class="kg" type="number" value="${cp}" onchange="S.caps=S.caps||[0,90,40];S.caps[${i}]=+this.value;save();render()">`:''}</span></div>${i?`<div class="bar ${v>cp?'over':''}" style="height:6px;margin:6px 0 0"><i style="width:${Math.min(100,v/cp*100)}%"></i></div>`:''}</div>`}).join('');
 const rec=[...S.spend].sort((x,y)=>y.d.localeCompare(x.d)).slice(0,15).map(x=>`<div class="item row"><span><b>${esc(x.t)}</b><br><span class="mu">${x.d} · ${sn(x.c)}</span></span><span>${money(x.a)}<button class="x" onclick="del('spend','${x.id}')">×</button></span></div>`).join('');
 return`<h1>Spending</h1><div class="sub">Week ${a} – ${b} · Sun–Sat</div>
 <div class="card"><div class="mu">This week</div><div class="big">${money(tot)}</div><div class="bar ${rem<0?'over':''}"><i style="width:${Math.min(100,tot/S.budget*100)}%"></i></div><div class="row mu"><span>${rem>=0?money(rem)+' left':money(-rem)+' over'}</span><span>of ${money(S.budget)}</span></div><div class="mu">${pace}</div></div>
 <div class="card row"><div><div class="mu">Balance</div><div class="big">${money(S.start-all)}</div></div><div style="text-align:right"><div class="mu">Frivolous ratio</div><div class="big">${all?pc(fr/all):'0%'}</div></div></div>
 <div class="card"><b>Weekly category caps</b>${cats}</div>
 <div class="card"><b>Add expense</b><div class="chips">${top}</div><div class="f" style="margin-top:8px"><input id="t" class="w" placeholder="Description" oninput="sugCat(this.value)"><input id="a" type="number" step="0.01" inputmode="decimal" placeholder="Amount"><input id="d" type="date" value="${today}"><select id="c" class="w">${CATS.map(c=>`<option>${c[0]}</option>`).join('')}</select></div><button class="go" onclick="addSpend()">Add</button></div>
 <div class="card"><b>Recent</b>${rec}</div>`}
function addSpend(){const a=parseFloat(document.getElementById('a').value);if(!(a>0))return;S.spend.push({id:uid(),t:document.getElementById('t').value.trim()||'Expense',a,d:document.getElementById('d').value||today,c:document.getElementById('c').value});save();render();toast(weekLeft())}
function sugCat(v){const x=[...S.spend].reverse().find(y=>y.t.toLowerCase()===v.toLowerCase());if(x)document.getElementById('c').value=x.c}
function weekLeft(){const[a,b]=weekRange(),t=S.spend.filter(x=>x.d>=a&&x.d<=b).reduce((s,x)=>s+x.a,0),r=S.budget-t;return r>=0?money(r)+' left this week':money(-r)+' over this week'}
/* FOOD */
const SAT=['Satisfied','Full','Overfull'];
function food(){
 const E=Object.entries(S.food).filter(([d,e])=>e.fh!=null).sort();const n=E.length||1;
 const fast=E.filter(([d,e])=>e.fh>=16).length,snf=E.filter(([d,e])=>e.sn===false).length;
 const meals=E.flatMap(([d,e])=>[e.bx?0:e.bs,e.lx?0:e.ls,e.dx?0:e.ds]).filter(Boolean),cnt=s=>meals.filter(m=>m===s).length;
 const avg=E.reduce((s,[d,e])=>s+e.fh,0)/n,sat=meals.length?cnt('Satisfied')/meals.length:0;
 const score=(fast/n+snf/n+sat)/3;const e=S.food[today]||{};
 const m=(l,f,sf)=>{const x=e[f+'x'];return`<div class="item"><div class="row"><span class="mu">${l}</span><span><button class="chip ${x?'on':''}" onclick="setV('food','${f}x',${!x})">${x?'✓ Skipped':'Skip'}</button>${x?'':` <input type="time" class="kg" style="width:112px!important" value="${esc(e[f+'t'])}" onchange="setV('food','${f}t',this.value)">`}</span></div>${x?'<div class="mu">Skipped — not counted in satiety or fast timing</div>':`<input placeholder="What did you eat?" value="${esc(e[f])}" onchange="setV('food','${f}',this.value)" style="margin:4px 0"><select onchange="setV('food','${sf}',this.value)"><option value="">Satiety…</option>${SAT.map(y=>`<option ${e[sf]===y?'selected':''}>${y}</option>`).join('')}</select>`}</div>`};
 const D=days7();const hrs=D.map(d=>(S.food[d]||{}).fh||0);
 const past=E.reverse().filter(([d])=>d!==today).slice(0,6).map(([d,x])=>`<div class="item"><div class="row"><b>${d}</b><span class="mu">${x.fh}h fast · ${x.sn===true?'snacked':x.sn===false?'no snacks':'–'}</span></div><div class="mu">${[x.b,x.l,x.d].filter(Boolean).map(esc).join(' · ')}</div></div>`).join('');
 return`<h1>Food</h1><div class="sub">Deficit & satiety sprint · Oct 9 – Dec 1 · 16:8 goal</div>
 <div class="card"><div class="mu">Deficit habit score (target 80%)</div><div class="big">${pc(score)}</div><div class="bar"><i style="width:${score*100}%"></i></div>
 <div class="f mu" style="margin-top:8px"><span>Fasting goal met: <b>${pc(fast/n)}</b></span><span>Snack-free days: <b>${snf}</b></span><span>Avg fast: <b>${avg.toFixed(1)}h</b></span><span>Optimal satiety: <b>${pc(sat)}</b></span></div></div>
 <div class="card"><b>Fasting hours, last 7 days</b><div class="mu">Goal 16h</div>${chart(hrs,16,v=>v>=16,16)}</div><div class="card"><b>Bodyweight trend (lbs)</b><div class="mu">Is the deficit working?</div>${spark(Object.keys(S.fx).sort().filter(d=>S.fx[d].bw).map(d=>S.fx[d].bw),v=>v)}</div>
 <div class="card"><div class="row"><b>Today · ${today}</b><button class="chip" onclick="foodCopy()">Same meals as yesterday</button></div>
